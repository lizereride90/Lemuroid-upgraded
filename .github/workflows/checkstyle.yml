name: Checkstyle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run ktlint tests
      run: ./gradlew ktlintCheck

    - name: Assemble debug build
      run: ./gradlew assembleFreeBundleDebug

    - name: Run unit tests
      # Game Sources feature tests: validation, zip-slip safety, installer,
      # catalog resolution and the streaming downloader (MockWebServer).
      run: ./gradlew :lemuroid-app:testFreeBundleDebugUnitTest
