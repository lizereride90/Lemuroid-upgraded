name: Generate stable signing keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -keystore release.jks \
            -storepass lemuroid -keypass lemuroid \
            -alias lemuroid \
            -dname "CN=Lemuroid PS2 CI" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
          if-no-files-found: error
